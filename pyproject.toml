[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-bot"
version = "0.4.0"
description = "Paper-first Angel One market intelligence and execution simulator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "smartapi-python==1.5.5",
  "pyotp>=2.9,<3",
  "websocket-client>=1.8,<2",
  "logzero>=1.7,<2",
  "pycryptodome>=3.20,<4",
  "yfinance>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
